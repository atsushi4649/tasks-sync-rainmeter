[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=#txtSyncNow#
ContextAction=[!CommandMeasure MeasureSync "Run"]
ContextTitle2=#txtLogin#
ContextAction2=[!CommandMeasure MeasureAuth "Run"]
ContextTitle3=#txtOpenData#
ContextAction3=["#DataDir#"]
ContextTitle4=#txtSettings#
ContextAction4=["notepad.exe" "#@#Variables.inc"]
ContextTitle5=#txtSupport#
ContextAction5=["https://ko-fi.com/atsushi4649"]

[Metadata]
Name=Tasks Sync
Author=atsushi4649
Information=Two-way Google Tasks widget for Rainmeter. Check / add / edit / delete tasks and switch lists.
Version=0.1.1
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Lang\#Language#.inc
; defaults until GTasks.ps1 writes State.inc
BGHeight=128
FooterY=111
InputH=24
AddInputX=24
AddInputY=99
InputW=176
ListTitle=Tasks
ListArrow=
AddHidden=1
ErrorHidden=1
ErrorMsg=
Demo=0
; personal data lives outside the skin folder (safe to update / share the skin)
DataDir=#SETTINGSPATH#TasksSync\
@Include3=#SETTINGSPATH#TasksSync\State.inc
PS=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\GTasks.ps1" -Lang #Language# -Width #Width# -MaxTasks #MaxTasks# -HeaderH #HeaderH# -RowH #RowH# -FooterH #FooterH# -PadX #PadX# -Inset #InsetFar# -Rainmeter "#PROGRAMPATH#Rainmeter.exe" -Config "#CURRENTCONFIG#" -DataDir "#SETTINGSPATH#TasksSync"

; ---------- styles ----------
[StyleText]
FontFace=#Font#
FontSize=#FontSize#
FontColor=#ColorText#
StringStyle=#TextStyle#
StringEffect=#TextEffect#
FontEffectColor=#ColorShadow#
AntiAlias=1

[StyleIcon]
FontFace=#IconFont#
FontColor=#ColorSub#
AntiAlias=1
SolidColor=0,0,0,1

; ---------- background ----------
[MeterBG]
Meter=Shape
; panel spans Inset (left/top) .. Width/BGHeight - InsetFar (right/bottom), like illustro's Background.png
; soft drop shadow
Shape=Rectangle (#Inset#-1),(#Inset#-1),(#Width#-#Inset#-#InsetFar#+2),(#BGHeight#-#Inset#-#InsetFar#+2),(#Radius#+1) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color 0,0,0,30
Shape4=Rectangle (#Inset#-2.5),(#Inset#-2.5),(#Width#-#Inset#-#InsetFar#+5),(#BGHeight#-#Inset#-#InsetFar#+5),(#Radius#+2.5) | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 0,0,0,14
Shape5=Rectangle (#Inset#-4.5),(#Inset#-4.5),(#Width#-#Inset#-#InsetFar#+9),(#BGHeight#-#Inset#-#InsetFar#+9),(#Radius#+4.5) | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 0,0,0,5
; header band / body (rounded panel split at HeaderH)
Shape2=Path HeaderPath | Fill Color #ColorHeaderBG# | StrokeWidth 0
Shape3=Path BodyPath | Fill Color #ColorBG# | StrokeWidth 0
HeaderPath=#Inset#,#HeaderH# | LineTo #Inset#,(#Inset#+#Radius#) | ArcTo (#Inset#+#Radius#),#Inset#,#Radius#,#Radius# | LineTo (#Width#-#InsetFar#-#Radius#),#Inset# | ArcTo (#Width#-#InsetFar#),(#Inset#+#Radius#),#Radius#,#Radius# | LineTo (#Width#-#InsetFar#),#HeaderH# | ClosePath 1
BodyPath=#Inset#,#HeaderH# | LineTo (#Width#-#InsetFar#),#HeaderH# | LineTo (#Width#-#InsetFar#),(#BGHeight#-#InsetFar#-#Radius#) | ArcTo (#Width#-#InsetFar#-#Radius#),(#BGHeight#-#InsetFar#),#Radius#,#Radius# | LineTo (#Inset#+#Radius#),(#BGHeight#-#InsetFar#) | ArcTo #Inset#,(#BGHeight#-#InsetFar#-#Radius#),#Radius#,#Radius# | ClosePath 1
; border
Shape6=Rectangle (#Inset#+0.5),(#Inset#+0.5),(#Width#-#Inset#-#InsetFar#-1),(#BGHeight#-#Inset#-#InsetFar#-1),#Radius# | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #ColorBorder#
; optional separator above footer (ColorLine alpha 0 = hidden)
Shape7=Line #PadX#,(#BGHeight#-#FooterH#),(#Width#-#InsetFar#-3),(#BGHeight#-#FooterH#) | StrokeWidth 1 | Stroke Color #ColorLine#

; ---------- header ----------
[MeterListTitle]
Meter=String
MeterStyle=StyleText
X=((#Width#-#PadX#)/2)
Y=((#HeaderH#+#Inset#)/2)
W=(#Width#-2*#PadX#-40)
ClipString=1
StringAlign=CenterCenter
StringCase=#TitleCase#
StringStyle=Bold
FontEffectColor=0,0,0,50
Text=#ListTitle# #ListArrow#
FontSize=#FontSizeTitle#
SolidColor=0,0,0,1
MouseOverAction=[!SetOption MeterListTitle FontColor "#ColorAccent#"][!UpdateMeter MeterListTitle][!Redraw]
MouseLeaveAction=[!SetOption MeterListTitle FontColor "#ColorText#"][!UpdateMeter MeterListTitle][!Redraw]
LeftMouseUpAction=[!SetOption MeterListTitle FontColor "#ColorSub#"][!SetOption MeterListTitle MouseLeaveAction ""][!UpdateMeter MeterListTitle][!Redraw][!CommandMeasure MeasureNextList "Run"]

[MeterError]
Meter=String
MeterStyle=StyleIcon
X=(#PadX#+6)
Y=((#HeaderH#+#Inset#)/2)
StringAlign=CenterCenter
Text=[\xE7BA]
FontSize=9
FontColor=#ColorDanger#
ToolTipText=#ErrorMsg#
Hidden=#ErrorHidden#

[MeterSync]
Meter=String
MeterStyle=StyleIcon
X=(#Width#-#PadX#-7)
Y=((#HeaderH#+#Inset#)/2)
StringAlign=CenterCenter
Text=[\xE72C]
FontSize=8
Padding=4,4,4,4
ToolTipText=#txtSyncNow#
MouseOverAction=[!SetOption MeterSync FontColor "#ColorText#"][!UpdateMeter MeterSync][!Redraw]
MouseLeaveAction=[!SetOption MeterSync FontColor "#ColorSub#"][!UpdateMeter MeterSync][!Redraw]
LeftMouseUpAction=[!SetOption MeterSync FontColor "#ColorAccent#"][!SetOption MeterSync MouseLeaveAction ""][!UpdateMeter MeterSync][!Redraw][!CommandMeasure MeasureSync "Run"]

; ---------- footer ----------
[MeterAddIcon]
Meter=String
MeterStyle=StyleIcon
X=(#PadX#+1)
Y=#FooterY#
StringAlign=LeftCenter
Text=[\xE710]
FontSize=7
FontColor=#ColorAccent#
Hidden=#AddHidden#

[MeterAdd]
Meter=String
MeterStyle=StyleText
X=(#PadX#+14)
Y=#FooterY#
W=(#Width#-2*#PadX#-14)
StringAlign=LeftCenter
Text=#txtAdd#
FontColor=#ColorAccent#
SolidColor=0,0,0,1
Hidden=#AddHidden#
LeftMouseUpAction=[!SetOption MeasureInput DefaultValue ""][!SetOption MeasureInput X #AddInputX#][!SetOption MeasureInput Y #AddInputY#][!SetOption MeasureInput W #InputW#][!UpdateMeasure MeasureInput][!CommandMeasure MeasureInput "ExecuteBatch 1"]

; ---------- text input (shared by add / edit) ----------
[MeasureInput]
Measure=Plugin
Plugin=InputText
DynamicVariables=1
X=0
Y=0
W=200
H=#InputH#
SolidColor=#ColorInputBG#
FontColor=#ColorText#
FontFace=#Font#
FontSize=#FontSize#
FocusDismiss=1
DefaultValue=
Command1=[!WriteKeyValue Input Title """$UserInput$""" "#DataDir#input.ini"][!SetOption MeterAdd Text "#txtAdding#"][!UpdateMeter MeterAdd][!Redraw][!CommandMeasure MeasureAdd "Run"]
Command2=[!WriteKeyValue Input Title """$UserInput$""" "#DataDir#input.ini"][!CommandMeasure MeasureEdit "Run"]

; ---------- PowerShell runners ----------
[MeasureSync]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=#PS# -Action sync
State=Hide

[MeasureNextList]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=#PS# -Action nextlist
State=Hide

[MeasureAdd]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=#PS# -Action add
State=Hide

[MeasureEdit]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=#PS# -Action edit
State=Hide

[MeasureAuth]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=#PS# -Action auth
State=Show

; sync 3 s after load (plugins need a few updates first) and every SyncMinutes
[MeasureTimer]
Measure=Calc
; own counter: Rainmeter's Counter does not reset on refresh
Formula=(MeasureTimer + 1) % (#SyncMinutes# * 60)
; (Demo=1 is set only by "GTasks.ps1 -Action demo": auto sync paused until manual sync)
IfCondition=(MeasureTimer = 3) && (#Demo# = 0)
IfTrueAction=[!CommandMeasure MeasureSync "Run"]

; ---------- task rows (generated by GTasks.ps1) ----------
[IncludeTasks]
@Include=#SETTINGSPATH#TasksSync\Tasks.inc
